name: Phase 11 Debug Alpha

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, Vitest, Chromium E2E and release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Install pnpm 11.9.0
        run: npm install --global pnpm@11.9.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build production bundle and verify isolation
        run: pnpm run build

      - name: Run Vitest
        run: pnpm run test:run

      - name: Run shuffled Vitest with the frozen seed
        run: pnpm run test:shuffle

      - name: Install Playwright Chromium only
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production-preview Chromium E2E
        run: pnpm run test:e2e

      - name: Check production artifact size
        run: pnpm run check:size

      - name: Check whitespace and tracked worktree cleanliness
        run: |
          git diff --check
          pnpm run check:tracked-clean
